# 프로덕션 docker-compose (멀티스테이지 빌드 + nginx)
# 실행: docker compose -f docker-compose.prod.yml up --build
# 접속: http://localhost:8080
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: software-4-frontend:prod
    container_name: software-4-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
